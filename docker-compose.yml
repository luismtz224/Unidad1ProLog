services:
  frontend:
    build: ./frontend

  backend:
    build: ./Backend
    environment:
      DATABASE_URL: mysql+pymysql://${BD_USUARIO}:${BD_PASSWORD}@bd:3306/${BD_NOMBRE}
      RUTA_IMAGENES: /data/imagenes
      RUTA_RESPALDOS: /data/respaldos
      CORS_ORIGINS: ${CORS_ORIGINS}
      TZ: America/Monterrey
    volumes:
      - imagenes:/data/imagenes
    depends_on:
      bd:
        condition: service_healthy

  bd:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${BD_ROOT_PASSWORD}
      MYSQL_DATABASE: ${BD_NOMBRE}
      MYSQL_USER: ${BD_USUARIO}
      MYSQL_PASSWORD: ${BD_PASSWORD}
    volumes:
      - bd_datos:/var/lib/mysql
      - ./db/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./db/02_catalogos.sql:/docker-entrypoint-initdb.d/02_catalogos.sql:ro
      - ./db/03_datos_prueba.sql:/docker-entrypoint-initdb.d/03_datos_prueba.sql:ro
      - ./db/04_consultas.sql:/docker-entrypoint-initdb.d/04_consultas.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 20

  proxy:
    image: nginx:1.27-alpine
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:80"
    depends_on: [frontend, backend]

  tunel:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate --url http://proxy:80
    depends_on: [proxy]

volumes:
  bd_datos:
  imagenes:

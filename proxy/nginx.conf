# Única puerta de entrada de la app (el túnel de Cloudflare apunta aquí).
#
# Se usa el resolver de Docker + variables para que nginx arranque aunque
# algún servicio todavía no esté listo (o falle): si el servicio Elixir
# se cae, el frontend y el backend del P1 siguen funcionando.

# cloudflared manda X-Forwarded-Proto (https); en local no viene.
map $http_x_forwarded_proto $proto_publico {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    client_max_body_size 10m;   # fotos (el frontend las manda en base64)

    resolver 127.0.0.11 valid=10s ipv6=off;

    proxy_set_header Host              $http_host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $proto_publico;

    # El backend del P1 YA declara sus rutas con /api (p. ej. /api/perritos/),
    # así que aquí NO se quita el prefijo: proxy_pass sin ruta lo conserva.
    location /api/ {
        set $backend http://backend:8000;
        proxy_pass $backend;
    }

    # Servicio Elixir: conserva el prefijo /f (el router lo declara con /f/...)
    location /f/ {
        set $funcional http://funcional:4000;
        proxy_pass $funcional;
    }

    location / {
        set $frontend http://frontend:80;
        proxy_pass $frontend;
    }
}
